# Continuous integration: the development tests (dev-tests/README.md) on every push and pull request
# to the development branch, in six jobs that run in parallel. Each job runs its group of programs
# through the pytest layer (dev-tests/test_programs.py) in strict mode: a missing engine, browser or
# tool fails the job instead of skipping checks.
#
# The portal on a real MongoDB is still an informative job: a failure there is shown but does not mark the
# run as failed, until it has proved stable on GitHub's runners. The portal in Chromium (e2e) and the
# installer started that way too and became required in item 2.3, step 4.
name: Development tests

on:
  push:
    branches: [gs1br/develop]
    paths-ignore: ["Documentation/**", "**/*.md"]
  pull_request:
    branches: [gs1br/develop]
    paths-ignore: ["Documentation/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_TESTS_STRICT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  resolver:
    name: Resolver, EPC binary, data entry API, GS1 suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-tests-setup
        with:
          npm: "true"
          syntax-engine: "true"
          gs1-suite: "true"
          playwright: "true"
      - run: python -m pytest dev-tests -m resolver -ra
        env:
          DEV_TESTS_TITLE: Resolver, EPC binary, data entry API, GS1 suite

  portal:
    name: Portal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-tests-setup
        with:
          npm: "true"
          syntax-engine: "true"
      - run: python -m pytest dev-tests -m portal -ra
        env:
          DEV_TESTS_TITLE: Portal

  database:
    # The portal's programs again, on a real MongoDB 7 instead of mongomock, plus test_store_mongodb.py:
    # the user made by portal-db-init, its privileges and the TTL monitor. The credentials exist only in
    # this throw-away service container.
    name: Portal on a real MongoDB (informative)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: devtests
          MONGO_INITDB_ROOT_PASSWORD: devtests-only
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PORTAL_TEST_MONGO_URI: mongodb://devtests:devtests-only@localhost:27017/?authSource=admin
      PORTAL_DB_URI: mongodb://devtests:devtests-only@localhost:27017/?authSource=admin
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-tests-setup
        with:
          npm: "true"
          syntax-engine: "true"
      - run: python -m pytest dev-tests -m "database or portal" -ra
        env:
          DEV_TESTS_TITLE: Portal on a real MongoDB

  e2e:
    name: Portal in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-tests-setup
        with:
          syntax-engine: "true"
          playwright: "true"
      - run: python -m pytest dev-tests -m e2e -ra
        env:
          DEV_TESTS_TITLE: Portal in Chromium

  home:
    name: Home page and proxy (nginx)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-tests-setup
        with:
          playwright: "true"
          nginx-org: "true"
      - run: python -m pytest dev-tests -m home -ra
        env:
          DEV_TESTS_TITLE: Home page and proxy

  install:
    name: Installer and deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-tests-setup
        with:
          nginx: "true"
          compose: "true"
      # The installer test runs as root: the pytest layer calls it through password-less sudo.
      - run: python -m pytest dev-tests -m install -ra
        env:
          DEV_TESTS_TITLE: Installer and deployment
