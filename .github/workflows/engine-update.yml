# Weekly check for a newer GS1 Barcode Syntax Engine (Documentation/adr/0003-gs1-rules-from-the-dictionary.md).
#
# When gs1/gs1-syntax-engine has a release newer than the one written in docker-compose.yml, this job uses it in
# the runner's own copy of the repository: builds it, generates portal/gs1_dictionary.json from its dictionary and
# portal/engine_messages.json from its messages, compares them with the committed files, runs the portal's
# development tests against them, and opens an issue saying what changed, messages without a translation included
# (one issue per release, never twice, even after it was closed). It never pushes: updating
# stays a reviewed change of x-gs1-syntax-engine and of the generated file.
name: GS1 Barcode Syntax Engine update check

on:
  schedule:
    - cron: "37 9 * * 1"          # Mondays at 09:37 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: engine-update
  cancel-in-progress: false

env:
  DEV_TESTS_STRICT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    name: Newer engine release?
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Pinned and latest releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^x-gs1-syntax-engine: *&gs1-syntax-engine *"\([^"]*\)".*/\1/p' docker-compose.yml)
          latest=$(gh api repos/gs1/gs1-syntax-engine/releases/latest --jq .tag_name)
          [[ -n $pinned && -n $latest ]] || { echo "::error::pinned='$pinned' latest='$latest'"; exit 1; }
          # the repository also has old date tags (2023-12-11): only numbered releases count
          if [[ ! $latest =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::notice::latest release '$latest' is not a numbered release; nothing to compare"
            latest=$pinned
          fi
          newest=$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n 1)
          title="GS1 Barcode Syntax Engine $latest is available (pinned: $pinned)"
          seen=$(gh issue list --state all --search "\"GS1 Barcode Syntax Engine $latest is available\" in:title" \
                   --json number --jq length)
          update=false
          if [[ $latest != "$pinned" && $newest == "$latest" && $seen == 0 ]]; then update=true; fi
          echo "Pinned $pinned, latest $latest, issue already opened: $seen, update check: $update"
          {
            echo "pinned=$pinned"
            echo "latest=$latest"
            echo "title=$title"
            echo "update=$update"
          } >> "$GITHUB_OUTPUT"

      - name: Use the new release in this run's copy only
        if: steps.releases.outputs.update == 'true'
        env:
          LATEST: ${{ steps.releases.outputs.latest }}
        run: |
          cp portal/gs1_dictionary.json "$RUNNER_TEMP/committed-dictionary.json"
          cp portal/engine_messages.json "$RUNNER_TEMP/committed-messages.json"
          sed -i "s/^x-gs1-syntax-engine: .*/x-gs1-syntax-engine: \&gs1-syntax-engine \"$LATEST\"/" docker-compose.yml
          grep -n '^x-gs1-syntax-engine' docker-compose.yml

      - if: steps.releases.outputs.update == 'true'
        uses: ./.github/actions/dev-tests-setup
        with:
          npm: "true"
          syntax-engine: "true"

      - name: Compare the dictionaries and the messages
        if: steps.releases.outputs.update == 'true'
        run: |
          python portal/tools/gen_dictionary.py "$GS1_SYNTAX_ENGINE_DIR"
          python portal/tools/dictionary_diff.py "$RUNNER_TEMP/committed-dictionary.json" portal/gs1_dictionary.json \
            > "$RUNNER_TEMP/summary.md"
          python portal/tools/gen_engine_messages.py "$GS1_SYNTAX_ENGINE_DIR" \
            --summary "$RUNNER_TEMP/committed-messages.json" >> "$RUNNER_TEMP/summary.md"
          python portal/tools/gen_engine_messages.py "$GS1_SYNTAX_ENGINE_DIR"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: The portal's development tests with the new release
        id: tests
        if: steps.releases.outputs.update == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest dev-tests -m portal -ra 2>&1 | tee "$RUNNER_TEMP/tests.txt"

      - name: Open the issue
        if: steps.releases.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.releases.outputs.title }}
          PINNED: ${{ steps.releases.outputs.pinned }}
          LATEST: ${{ steps.releases.outputs.latest }}
          TESTS: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "A newer release of the [GS1 Barcode Syntax Engine](https://github.com/gs1/gs1-syntax-engine/releases/tag/$LATEST)"
            echo "is available. This installation uses $PINNED (\`x-gs1-syntax-engine\` in \`docker-compose.yml\`)."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            if [[ $TESTS == success ]]; then
              echo "**The portal's development tests** pass with $LATEST."
            else
              echo "**The portal's development tests** fail with $LATEST: see the end of their output below and the [run]($RUN_URL)."
            fi
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/tests.txt"
            echo '```'
            echo
            echo "To update: change \`x-gs1-syntax-engine\` in \`docker-compose.yml\`, build the engine"
            echo "(\`portal/tools/build-syntax-engine.sh\`), regenerate \`portal/gs1_dictionary.json\` with"
            echo "\`portal/tools/gen_dictionary.py\` and \`portal/engine_messages.json\` with"
            echo "\`portal/tools/gen_engine_messages.py\`, translate the messages listed above in \`portal/static/i18n.js\`,"
            echo "run every development test, then \`docker compose up -d --build\`."
            echo "See Documentation/adr/0003-gs1-rules-from-the-dictionary.md. Opened by the weekly update check ($RUN_URL)."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
