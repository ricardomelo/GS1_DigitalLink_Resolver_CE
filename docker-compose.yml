services:
  database-service:
    build: './database_server'
    container_name: database-server
    restart: always
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    ports:
      - "${DATABASE_BIND_ADDRESS:-0.0.0.0}:27017:27017"
    volumes:
      - resolver-database-volume:/data/db
    networks:
      - resolver-internal-network

  data-entry-service:
    build: './data_entry_server'
    container_name: data-entry-server
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    depends_on:
      - database-service
    restart: always
    networks:
      - resolver-internal-network

  web-service:
    build: './web_server'
    container_name: resolver-web-server
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    depends_on:
      - database-service
    restart: always
    networks:
      - resolver-internal-network

  frontend-proxy-service:
    build: './frontend_proxy_server'
    container_name: frontend-proxy-server
    depends_on:
      - web-service
      - data-entry-service
    restart: always
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:8080:80"
    networks:
      - resolver-internal-network


volumes:
  resolver-database-volume: {}

networks:
  resolver-internal-network:
    name: resolver-internal-network
