# The release of the GS1 Barcode Syntax Engine and of its GS1 Barcode Syntax Dictionary, the same for every
# service that checks GS1 data: the resolver and the data entry API (gs1encoder, WebAssembly) and the portal
# (the C library, built from source). Written here only; each image receives it as a build argument
# (Documentation/adr/0003-gs1-rules-from-the-dictionary.md). Change it on purpose, after the weekly check's
# issue and a test run: portal/gs1_dictionary.json must be generated again from the new release.
x-gs1-syntax-engine: &gs1-syntax-engine "1.4.1"

# The containers' output (Documentation/adr/0043-access-logs.md): Docker's json-file driver keeps it until the container
# is removed, with no limit of its own; here each container keeps at most LOG_MAX_FILES files of LOG_MAX_SIZE (from
# .env; 10m and 5 by default), the oldest dropped first. Read it with "docker compose logs <service>".
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

# The Python services' root file system is read only (Documentation/adr/0061-read-only-file-systems.md): code that
# could be made to write a file can write only to /tmp, a memory file system emptied at every start (gunicorn's worker
# files, a large spreadsheet's temporary files), and to the volumes below. The proxy, which writes its configuration
# when it starts, and the database (the official MongoDB image) are not read only.
x-read-only: &read-only
  read_only: true
  tmpfs:
    - /tmp:size=64m
x-read-only-portal: &read-only-portal
  read_only: true
  tmpfs:
    - /tmp:size=256m                  # an export of 50,000 rows writes its workbook through temporary files

services:
  database-service:
    logging: *logging
    build: './database_server'
    container_name: database-server
    restart: always
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    ports:
      # the host's loopback address unless .env says otherwise (Documentation/adr/0030-least-privilege-services.md)
      - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:27017:27017"
    volumes:
      - resolver-database-volume:/data/db
    networks:
      - resolver-internal-network

  # The four services below may run as several replicas (containers) each: the number comes from .env
  # (*_REPLICAS, default 1) and the number of server processes in each container from *_PROCESSES
  # (default 2). They keep no state of their own, so they have no fixed container_name (Compose cannot
  # replicate a service with one); the proxy finds every replica through Docker's DNS (nginx.conf).
  data-entry-service:
    logging: *logging
    <<: *read-only
    build:
      context: './data_entry_server'
      args:
        GS1_SYNTAX_ENGINE_RELEASE: *gs1-syntax-engine
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    environment:
      WEB_CONCURRENCY: ${DATA_ENTRY_SERVICE_PROCESSES:-2}   # gunicorn processes in each container
      # Its own MongoDB user (DATA_ENTRY_DB_*: the records only), never the root one (ADR 0030)
      MONGO_URI: ""
      MONGO_INITDB_ROOT_USERNAME: ""
      MONGO_INITDB_ROOT_PASSWORD: ""
    deploy:
      replicas: ${DATA_ENTRY_SERVICE_REPLICAS:-1}
    depends_on:
      portal-db-init:
        condition: service_completed_successfully   # its own MongoDB user, made or brought up to date
    restart: always
    networks:
      - resolver-internal-network

  web-service:
    logging: *logging
    <<: *read-only
    build:
      context: './web_server'
      additional_contexts:
        engine-tools: './portal/tools'   # build-syntax-engine.sh, shared with the portal (ADR 0003)
      args:
        GS1_SYNTAX_ENGINE_RELEASE: *gs1-syntax-engine
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    environment:
      WEB_CONCURRENCY: ${WEB_SERVICE_PROCESSES:-2}   # gunicorn processes in each container
      # Its own MongoDB user (RESOLVER_DB_*: reads records and the portal's settings, writes the request log), never
      # the root one (ADR 0030)
      MONGO_URI: ""
      MONGO_INITDB_ROOT_USERNAME: ""
      MONGO_INITDB_ROOT_PASSWORD: ""
    volumes:
      # the GeoIP database of the request log (scripts/geoip-update.sh; Documentation/adr/0006-resolver-request-log.md,
      # section 8), read only; without a file there requests are logged without a location
      - ./geoip:/geoip:ro
    deploy:
      replicas: ${WEB_SERVICE_REPLICAS:-1}
    depends_on:
      portal-db-init:
        condition: service_completed_successfully   # its own MongoDB user, made or brought up to date
    restart: always
    networks:
      - resolver-internal-network

  portal-db-init:
    logging: *logging
    <<: *read-only
    # One-shot: creates the MongoDB users of the portal, the resolver and the data entry API, each with the least
    # privileges it needs, or brings their passwords and roles up to date, then exits; the other services start
    # after it. It alone receives the root MONGO_URI (Documentation/adr/0030-least-privilege-services.md).
    build:
      context: './portal'
      additional_contexts:
        git-dir: './.git'   # the version the About page shows, written at the build (ADR 0024)
      args:
        GS1_SYNTAX_ENGINE_RELEASE: *gs1-syntax-engine
    command: ["python", "db_init.py"]
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    depends_on:
      - database-service
    restart: "no"
    networks:
      - resolver-internal-network

  portal-service:
    logging: *logging
    <<: *read-only-portal
    # Link management portal for non-technical users (served at /portal/ by the proxy)
    build:
      context: './portal'
      additional_contexts:
        git-dir: './.git'   # the version the About page shows, written at the build (ADR 0024)
      args:
        GS1_SYNTAX_ENGINE_RELEASE: *gs1-syntax-engine
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    environment:
      DATA_ENTRY_URL: http://data-entry-service:3000/api
      # The portal changes records through the data entry API only, and keeps its own data in its own
      # database with its own user (PORTAL_DB_*); it is not given the root MongoDB credentials.
      MONGO_URI: ""
      MONGO_INITDB_ROOT_USERNAME: ""
      MONGO_INITDB_ROOT_PASSWORD: ""
      WEB_CONCURRENCY: ${PORTAL_SERVICE_PROCESSES:-2}   # gunicorn processes in each container
    deploy:
      replicas: ${PORTAL_SERVICE_REPLICAS:-1}
    volumes:
      - resolver-portal-config:/app/config
    depends_on:
      data-entry-service:
        condition: service_started
      portal-db-init:
        condition: service_completed_successfully
    restart: always
    networks:
      - resolver-internal-network

  portal-worker:
    logging: *logging
    <<: *read-only-portal
    # Runs the portal's background jobs (spreadsheet imports, link checks) from the jobs collection of the
    # portal's database; same image and settings as the portal, another command. It finishes the record in
    # hand, hands its job back to the queue and stops on "docker compose stop" (stop_grace_period). Each
    # replica runs one job at a time; more replicas run more jobs in parallel.
    build:
      context: './portal'
      additional_contexts:
        git-dir: './.git'   # the version the About page shows, written at the build (ADR 0024)
      args:
        GS1_SYNTAX_ENGINE_RELEASE: *gs1-syntax-engine
    command: ["python", "worker.py"]
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    environment:
      DATA_ENTRY_URL: http://data-entry-service:3000/api
      PORTAL_WORKER: external
      MONGO_URI: ""
      MONGO_INITDB_ROOT_USERNAME: ""
      MONGO_INITDB_ROOT_PASSWORD: ""
    deploy:
      replicas: ${PORTAL_WORKER_REPLICAS:-1}
    volumes:
      - resolver-portal-config:/app/config
    depends_on:
      data-entry-service:
        condition: service_started
      portal-db-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: always
    networks:
      - resolver-internal-network

  frontend-proxy-service:
    logging: *logging
    build: './frontend_proxy_server'
    container_name: frontend-proxy-server
    # nginx asks Docker's DNS for the addresses of these services every 10 seconds ("resolve" in
    # nginx.conf), so it follows recreated containers and added or removed replicas without a restart.
    depends_on:
      - web-service
      - data-entry-service
      - portal-service
    restart: always
    # Who may use the official data entry API through the proxy (/api, /swaggerui; ADR 0021): read from .env by
    # Compose; empty, closed to every address. The proxy is given these settings only, none of the secrets.
    environment:
      DATA_ENTRY_API_ALLOW: ${DATA_ENTRY_API_ALLOW:-}
      PROXY_TRUSTED_PROXIES: ${PROXY_TRUSTED_PROXIES:-}
      PROXY_BIND_ADDRESS: ${PROXY_BIND_ADDRESS:-127.0.0.1}
      # request limits per client address (ADR 0031); empty, the defaults of api-access.sh
      PROXY_LIMIT_RESOLVE: ${PROXY_LIMIT_RESOLVE:-}
      PROXY_LIMIT_PORTAL: ${PROXY_LIMIT_PORTAL:-}
      PROXY_LIMIT_SIGNIN: ${PROXY_LIMIT_SIGNIN:-}
      PROXY_LIMIT_CONNECTIONS: ${PROXY_LIMIT_CONNECTIONS:-}
      PROXY_LIMIT_EXEMPT: ${PROXY_LIMIT_EXEMPT:-}
      # what the access log keeps (ADR 0043): minimal (the default), full or off
      PROXY_ACCESS_LOG: ${PROXY_ACCESS_LOG:-}
      # where the portal answers (ADR 0057): on PORTAL_ORIGIN's name only when it is not the resolver's
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:-}
      RESOLVER_PUBLIC_URL: ${RESOLVER_PUBLIC_URL:-}
      FQDN: ${FQDN:-}
    # the host's loopback address unless .env says otherwise (ADR 0030): the installer writes PROXY_BIND_ADDRESS
    ports:
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:8080:80"
    networks:
      - resolver-internal-network

  mailpit:
    logging: *logging
    # Only for trying the portal's e-mail on a test installation before a real relay exists
    # (Documentation/adr/0004-e-mail.md, decision 9); never in production. Not started by "docker compose up":
    # "docker compose --profile mail-test up -d mailpit" starts it. It accepts every message on port 1025
    # (PORTAL_MAIL_HOST=mailpit, PORTAL_MAIL_PORT=1025, PORTAL_MAIL_SECURITY=none) and shows them, with its API,
    # on port 8025 of the host's loopback address only.
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    profiles: ["mail-test"]
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    networks:
      - resolver-internal-network


volumes:
  resolver-database-volume: {}
  resolver-portal-config: {}

networks:
  resolver-internal-network:
    name: resolver-internal-network
