# The release of the GS1 Barcode Syntax Engine and of its GS1 Barcode Syntax Dictionary, the same for every
# service that checks GS1 data: the resolver and the data entry API (gs1encoder, WebAssembly) and the portal
# (the C library, built from source). Written here only; each image receives it as a build argument
# (Documentation/adr/0003-gs1-rules-from-the-dictionary.md). Change it on purpose, after the weekly check's
# issue and a test run: portal/gs1_dictionary.json must be generated again from the new release.
x-gs1-syntax-engine: &gs1-syntax-engine "1.4.1"

services:
  database-service:
    build: './database_server'
    container_name: database-server
    restart: always
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    ports:
      - "${DATABASE_BIND_ADDRESS:-0.0.0.0}:27017:27017"
    volumes:
      - resolver-database-volume:/data/db
    networks:
      - resolver-internal-network

  # The four services below may run as several replicas (containers) each: the number comes from .env
  # (*_REPLICAS, default 1) and the number of server processes in each container from *_PROCESSES
  # (default 2). They keep no state of their own, so they have no fixed container_name (Compose cannot
  # replicate a service with one); the proxy finds every replica through Docker's DNS (nginx.conf).
  data-entry-service:
    build:
      context: './data_entry_server'
      args:
        GS1_SYNTAX_ENGINE_RELEASE: *gs1-syntax-engine
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    environment:
      WEB_CONCURRENCY: ${DATA_ENTRY_SERVICE_PROCESSES:-2}   # gunicorn processes in each container
    deploy:
      replicas: ${DATA_ENTRY_SERVICE_REPLICAS:-1}
    depends_on:
      - database-service
    restart: always
    networks:
      - resolver-internal-network

  web-service:
    build:
      context: './web_server'
      args:
        GS1_SYNTAX_ENGINE_RELEASE: *gs1-syntax-engine
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    environment:
      WEB_CONCURRENCY: ${WEB_SERVICE_PROCESSES:-2}   # gunicorn processes in each container
    deploy:
      replicas: ${WEB_SERVICE_REPLICAS:-1}
    depends_on:
      - database-service
    restart: always
    networks:
      - resolver-internal-network

  portal-db-init:
    # One-shot: creates the portal's own MongoDB user (readWrite on PORTAL_DB_NAME only), or brings its
    # password and roles up to date, then exits. It alone receives the root MONGO_URI on the portal's side.
    build:
      context: './portal'
      args:
        GS1_SYNTAX_ENGINE_RELEASE: *gs1-syntax-engine
    command: ["python", "db_init.py"]
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    depends_on:
      - database-service
    restart: "no"
    networks:
      - resolver-internal-network

  portal-service:
    # Link management portal for non-technical users (served at /portal/ by the proxy)
    build:
      context: './portal'
      args:
        GS1_SYNTAX_ENGINE_RELEASE: *gs1-syntax-engine
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    environment:
      DATA_ENTRY_URL: http://data-entry-service:3000/api
      # The portal changes records through the data entry API only, and keeps its own data in its own
      # database with its own user (PORTAL_DB_*); it is not given the root MongoDB credentials.
      MONGO_URI: ""
      MONGO_INITDB_ROOT_USERNAME: ""
      MONGO_INITDB_ROOT_PASSWORD: ""
      WEB_CONCURRENCY: ${PORTAL_SERVICE_PROCESSES:-2}   # gunicorn processes in each container
    deploy:
      replicas: ${PORTAL_SERVICE_REPLICAS:-1}
    volumes:
      - resolver-portal-config:/app/config
    depends_on:
      data-entry-service:
        condition: service_started
      portal-db-init:
        condition: service_completed_successfully
    restart: always
    networks:
      - resolver-internal-network

  portal-worker:
    # Runs the portal's background jobs (spreadsheet imports, link checks) from the jobs collection of the
    # portal's database; same image and settings as the portal, another command. It finishes the record in
    # hand, hands its job back to the queue and stops on "docker compose stop" (stop_grace_period). Each
    # replica runs one job at a time; more replicas run more jobs in parallel.
    build:
      context: './portal'
      args:
        GS1_SYNTAX_ENGINE_RELEASE: *gs1-syntax-engine
    command: ["python", "worker.py"]
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    environment:
      DATA_ENTRY_URL: http://data-entry-service:3000/api
      PORTAL_WORKER: external
      MONGO_URI: ""
      MONGO_INITDB_ROOT_USERNAME: ""
      MONGO_INITDB_ROOT_PASSWORD: ""
    deploy:
      replicas: ${PORTAL_WORKER_REPLICAS:-1}
    volumes:
      - resolver-portal-config:/app/config
    depends_on:
      data-entry-service:
        condition: service_started
      portal-db-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: always
    networks:
      - resolver-internal-network

  frontend-proxy-service:
    build: './frontend_proxy_server'
    container_name: frontend-proxy-server
    # nginx asks Docker's DNS for the addresses of these services every 10 seconds ("resolve" in
    # nginx.conf), so it follows recreated containers and added or removed replicas without a restart.
    depends_on:
      - web-service
      - data-entry-service
      - portal-service
    restart: always
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:8080:80"
    networks:
      - resolver-internal-network


volumes:
  resolver-database-volume: {}
  resolver-portal-config: {}

networks:
  resolver-internal-network:
    name: resolver-internal-network
