services:
  database-service:
    build: './database_server'
    container_name: database-server
    restart: always
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    ports:
      - "${DATABASE_BIND_ADDRESS:-0.0.0.0}:27017:27017"
    volumes:
      - resolver-database-volume:/data/db
    networks:
      - resolver-internal-network

  data-entry-service:
    build: './data_entry_server'
    container_name: data-entry-server
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    depends_on:
      - database-service
    restart: always
    networks:
      - resolver-internal-network

  web-service:
    build: './web_server'
    container_name: resolver-web-server
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    depends_on:
      - database-service
    restart: always
    networks:
      - resolver-internal-network

  portal-service:
    # Link management portal for non-technical users (served at /portal/ by the proxy)
    build: './portal'
    container_name: resolver-portal
    env_file:
      - path: .env.example
        required: true
      - path: .env          # installation values; overrides .env.example (never committed)
        required: false
    environment:
      DATA_ENTRY_URL: http://data-entry-service:3000/api
      # The portal talks to the data entry API only; it is not given the MongoDB credentials.
      MONGO_URI: ""
      MONGO_INITDB_ROOT_USERNAME: ""
      MONGO_INITDB_ROOT_PASSWORD: ""
    volumes:
      - resolver-portal-config:/app/config
    depends_on:
      - data-entry-service
    restart: always
    networks:
      - resolver-internal-network

  frontend-proxy-service:
    build: './frontend_proxy_server'
    container_name: frontend-proxy-server
    # nginx resolves the upstream names once, at start-up. When Compose recreates one of these
    # services it can come back with a new IP address, and the proxy would answer 502 until it is
    # restarted; "restart: true" makes Compose restart the proxy whenever it updates a dependency.
    depends_on:
      web-service:
        condition: service_started
        restart: true
      data-entry-service:
        condition: service_started
        restart: true
      portal-service:
        condition: service_started
        restart: true
    restart: always
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:8080:80"
    networks:
      - resolver-internal-network


volumes:
  resolver-database-volume: {}
  resolver-portal-config: {}

networks:
  resolver-internal-network:
    name: resolver-internal-network
