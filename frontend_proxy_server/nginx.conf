user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    # The upstream's name is also the Host header nginx sends to the web server; it must be a valid host
    # name: Werkzeug 3.1 refuses "resolver_web" (underscore), which turned every resolution into a 500.
    upstream resolver-web {
        server web-service:4000;
    }

    server {
        listen 80;

        # ---- Home page at the resolver root ----
        # "/" on its own is not a GS1 Digital Link, so the home page takes it; every other path still
        # goes to the resolver. The files are copied from frontend_proxy_server/home into the image.
        # "/" used to show the web server's Swagger UI; the same documentation is at /api/docs.
        location = / {
            root /usr/share/nginx/home;
            try_files /index.html =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        }

        # Home page assets (style sheet, script, logo, icon)
        location = /home  { return 301 /; }
        location = /home/ { return 301 /; }
        location ^~ /home/ {
            alias /usr/share/nginx/home/;
            autoindex off;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Public resolution of GS1 Digital Links. The request URI is passed on exactly as received
        # ($request_uri): with "proxy_pass http://web-service:4000/api/;" nginx sent the decoded path, so a
        # value containing "/" (written %2F, GS1 Digital Link URI Syntax 1.7, section 4.2) became two path
        # segments. With a variable in proxy_pass nginx does not touch the URI; the upstream block lets it
        # find the service without a resolver directive.
        location / {
            proxy_pass http://resolver-web/api$request_uri;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
            proxy_busy_buffers_size 16k;
        }

        # Resolver CE data entry API (unchanged)
        location /api {
            proxy_pass http://data-entry-service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swaggerui {
            proxy_pass http://data-entry-service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Link management portal for non-technical users (portal-service) ----
        location = /portal {
            return 301 /portal/;
        }

        location /portal/ {
            proxy_pass http://portal-service:8000;   # no trailing slash: keeps the /portal/ prefix
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 1m;   # spreadsheet imports (file ≤ 700 KB, sent as base64)
        }
    }
}
