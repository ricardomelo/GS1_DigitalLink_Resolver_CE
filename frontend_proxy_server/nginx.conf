user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- The access log (Documentation/adr/0043-access-logs.md, finding F-025) ----
    # PROXY_ACCESS_LOG chooses what each request leaves in the container's output; api-access.sh writes the included
    # file when the container starts, setting one of the two variables below to 1 (the file baked into the image:
    # "minimal"). "minimal", the default: the time, the method, the area of the path (its first segment when it is a
    # word or an application identifier, else "/..."), the status, the size and the time taken: never the client's
    # address, the rest of the path, the query string, the User-Agent or the referrer, which the request log does not
    # keep either (ADR 0006). "full": the address and the whole request line too (personal data: for a diagnosis,
    # for as long as it lasts; the privacy notice must then say so). "off": no line at all. In "minimal" and "off"
    # the request limits' refusals are not written to the error log either (their lines name the client and the
    # request): the access log shows them as status 429.
    log_format  minimal  '$time_iso8601 $request_method $log_area $status $body_bytes_sent $request_time';
    log_format  full  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" $request_time';
    # from the path as the client sent it ($uri would name the index file nginx chose); never past its first segment
    map $request_uri $log_area {
        default                                                                          "/...";
        "~^/(?:\?|$)"                                                                    "/";
        "~^(?<area>/(?:[0-9]{2,4}|\.well-known|[a-z][a-z-]{0,19}(?:\.[a-z]{2,4})?))(?:/|\?|$)"  $area;
    }
    include /etc/nginx/access-log.conf;
    access_log  /var/log/nginx/access.log  minimal  if=$access_log_minimal;
    access_log  /var/log/nginx/access.log  full  if=$access_log_full;

    # ---- The client's address ----
    # $remote_addr becomes the client's address when the request came through proxies this one trusts: walking
    # X-Forwarded-For from its end, the first address that is not a trusted proxy. api-access.sh writes the included
    # file when the container starts ("set_real_ip_from <address>;" for PROXY_TRUSTED_PROXIES, and for the
    # container's gateway when PROXY_BIND_ADDRESS is a loopback address); empty, the connection's address is kept.
    # The addresses before the last untrusted one are whatever the client wrote, never believed. Every service
    # behind this proxy gets the result alone in X-Real-IP and X-Forwarded-For (set, not appended).
    include /etc/nginx/real-ip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ---- Request limits per client address (Documentation/adr/0031-request-limits.md) ----
    # Counted per client address found above. An IPv6 address counts with every address of its /64 network (one
    # subscriber's usual allocation, written by nginx in its shortest form), so changing the interface part does not
    # step around the limits. The addresses and networks of PROXY_LIMIT_EXEMPT get an empty key, which nginx does not
    # count. api-access.sh writes the zones with the rates of PROXY_LIMIT_* (limits-http.conf) and the limit of each
    # group of paths (limit-*.conf; empty when its setting is 0); the empty files baked into the image set no limit.
    # Over a limit, nginx answers 429 with Retry-After itself (error_page below), before any service is reached.
    map $remote_addr $limit_client {
        "~^(?<net>(?:[0-9a-fA-F]{1,4}:){4})"   $net;
        "~^(?<net>[0-9a-fA-F:]*::)"             $net;
        default                                 $remote_addr;
    }
    geo $limit_exempt {
        default 0;
        include /etc/nginx/limit-exempt.conf;
    }
    map $limit_exempt $limit_key {
        1       "";
        default $limit_client;
    }
    include /etc/nginx/limits-http.conf;
    limit_req_status 429;
    limit_conn_status 429;
    # the level of their refusals' lines in the error log: access-log.conf (warn, written, only with the full log)

    # ---- HTTPS only, for browsers (Documentation/adr/0038-browser-hardening.md, finding F-021) ----
    # The host's proxy ends TLS and says so in X-Forwarded-Proto (scripts/templates, Certbot's server blocks): the
    # answers to a request made over HTTPS tell the browser to use nothing but HTTPS for this name for a year
    # (Strict-Transport-Security). Not for other names under it (no includeSubDomains) and not preloaded: an operator
    # decides those. Browsers ignore the header on an answer over plain HTTP, so a client that writes the header
    # itself changes nothing. nginx sends no header whose value is empty. A location with add_header of its own does
    # not inherit the server's, so those below repeat it.
    map $http_x_forwarded_proto $strict_transport {
        "~*^https"  "max-age=31536000";
        default     "";
    }

    # ---- The portal on a host name of its own (Documentation/adr/0057-portal-own-host-name.md) ----
    # api-access.sh writes the included file when the container starts: a map of the request's host and path to the
    # address the server below redirects to (302) before any location, empty to serve the request. With PORTAL_ORIGIN
    # naming another host than the resolver's, the portal answers on that name only and nothing else does there; on
    # the other names the tenant API and the public files the home page reads stay, the portal's other paths go to its
    # name. The file baked into the image maps nothing: one origin for everything.
    include /etc/nginx/portal-host.conf;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    # ---- The services behind the proxy, each with one or more replicas ----
    # Docker's DNS (127.0.0.11) answers a service name with the address of every replica. "resolve" makes
    # nginx ask again when the answer is 10 seconds old, so it follows recreated containers and added or
    # removed replicas without a restart, and starts even while a service is down (nginx 1.27.3 or later;
    # the peers live in the shared "zone"). Requests are shared among the replicas in turn; a replica that
    # refuses the connection is skipped (proxy_next_upstream, default).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # The upstream's name is also the Host header nginx sends to the web server; it must be a valid host
    # name: Werkzeug 3.1 refuses "resolver_web" (underscore), which turned every resolution into a 500.
    upstream resolver-web {
        zone resolver-web 64k;
        server web-service:4000 resolve;
    }

    upstream data-entry {
        zone data-entry 64k;
        server data-entry-service:3000 resolve;
    }

    upstream portal {
        zone portal 64k;
        server portal-service:8000 resolve;
    }

    # ---- Who may use the official data entry API (/api, /swaggerui) ----
    # Closed to every address unless .env lists addresses or networks in DATA_ENTRY_API_ALLOW
    # (Documentation/adr/0021-data-entry-api-closed.md): its one token changes any organisation's records outside the
    # portal's rules and its audit trail; organisations' systems use the tenant API (/portal/api/v1) instead. The portal
    # reaches the service inside Docker's network, not through this proxy. api-access.sh writes the included file when
    # the container starts: "<address or network> 1;" for each allowed entry, matched against the client's address
    # resolved through the trusted proxies above.
    geo $data_entry_api_allowed {
        default 0;
        include /etc/nginx/api-access.conf;
    }

    server {
        listen 80;
        # The redirects nginx writes itself (/portal, /home) give the path alone (Location: /portal/), not
        # http://<the Host the client sent>/portal/: a forged Host is not written into an answer a shared cache might
        # keep, and a request made over HTTPS is not sent to plain HTTP (Documentation/adr/0039-known-public-names.md)
        absolute_redirect off;

        # connections at once per client address (PROXY_LIMIT_CONNECTIONS), for every path
        include /etc/nginx/limit-server.conf;
        add_header Strict-Transport-Security $strict_transport always;
        error_page 429 = @too_many;
        # the portal on its own name (above): a request for the other side is sent there
        if ($host_redirect) {
            return 302 $host_redirect;
        }
        location @too_many {
            add_header Retry-After 1 always;
            add_header Strict-Transport-Security $strict_transport always;
            default_type text/plain;
            return 429 "Too many requests from your address: try again in a moment.\n";
        }
        # the same for the portal, as JSON with a message code its pages show in the user's language
        location @too_many_json {
            add_header Retry-After 1 always;
            add_header Strict-Transport-Security $strict_transport always;
            default_type application/json;
            return 429 '{"code": "proxy.tooMany"}';
        }

        # ---- Home page at the resolver root ----
        # "/" on its own is not a GS1 Digital Link, so the home page takes it; every other path still
        # goes to the resolver. The files are copied from frontend_proxy_server/home into the image.
        # "/" used to show the web server's Swagger UI; the same documentation is at /api/docs.
        location = / {
            include /etc/nginx/limit-resolve.conf;
            root /usr/share/nginx/home;
            try_files /index.html =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
            add_header Strict-Transport-Security $strict_transport always;
        }

        # Home page assets (style sheet, script, logo, icon)
        location = /home  { return 301 /; }
        location = /home/ { return 301 /; }
        location ^~ /home/ {
            include /etc/nginx/limit-resolve.conf;
            alias /usr/share/nginx/home/;
            autoindex off;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security $strict_transport always;
        }

        # Public resolution of GS1 Digital Links. The request URI is passed on exactly as received
        # ($request_uri): with "proxy_pass http://web-service:4000/api/;" nginx sent the decoded path, so a
        # value containing "/" (written %2F, GS1 Digital Link URI Syntax 1.7, section 4.2) became two path
        # segments. With a variable in proxy_pass nginx does not touch the URI; the name of an upstream
        # block is not looked up in DNS (its servers are, above).
        location / {
            include /etc/nginx/limit-resolve.conf;      # PROXY_LIMIT_RESOLVE
            proxy_pass http://resolver-web/api$request_uri;
            # the public name the request was made on: an organisation's own domain is recognised by the resolver
            # (Documentation/adr/0009-tenant-domains.md); Host stays the upstream's, which Werkzeug accepts
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
            proxy_busy_buffers_size 16k;
        }

        # Resolver CE data entry API, for the addresses allowed above only (403 for the others). No request rate: only
        # the addresses an operator listed reach it, and their bulk loads must not be cut short (the connections still
        # count).
        location /api {
            if ($data_entry_api_allowed = 0) { return 403; }
            proxy_pass http://data-entry;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swaggerui {
            if ($data_entry_api_allowed = 0) { return 403; }
            proxy_pass http://data-entry;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Link management portal for non-technical users (portal-service) ----
        location = /portal {
            return 301 /portal/;
        }

        # Sign-in, password recovery and single sign-on, which anyone may call: a rate of their own, per minute
        # (PROXY_LIMIT_SIGNIN), before the portal's own limits per user name and address (finding F-005)
        location ~ ^/portal/(?:api/login|api/password/forgot|api/password/link|api/password/link/check|api/sso/start|sso/callback)$ {
            include /etc/nginx/limit-signin.conf;
            error_page 429 = @too_many_json;
            proxy_pass http://portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /portal/ {
            include /etc/nginx/limit-portal.conf;       # PROXY_LIMIT_PORTAL: pages, the portal's API, the tenant API
            error_page 429 = @too_many_json;
            proxy_pass http://portal;   # no trailing slash: keeps the /portal/ prefix
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 1m;   # spreadsheet imports (file ≤ 700 KB, sent as base64)
        }
    }
}
