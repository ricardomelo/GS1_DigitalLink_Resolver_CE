<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GS1 Resolver Community Edition</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" data-i18n-attr="title:header.home">
        <img src="gs1-logo.png" alt="GS1" width="54" height="44">
        <span class="product">GS1 Resolver Community Edition</span>
      </a>
      <div class="header-tools">
        <label class="locale-picker">
          <span class="visually-hidden" data-i18n="header.language"></span>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8ZM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4ZM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3Zm.8 2h3c.3 1.3.8 2.5 1.4 3.6A8 8 0 0 1 5.1 16ZM8.1 8h-3a8 8 0 0 1 4.4-3.6C8.9 5.5 8.4 6.7 8.1 8ZM12 20c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h3a8 8 0 0 1-4.4 3.6Zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4Z"/></svg>
          <select id="locale"></select>
        </label>
        <div class="user-menu" id="user-menu">
          <button type="button" class="user-button" id="user-button" aria-haspopup="menu" aria-expanded="false"
                  aria-controls="user-menu-panel" data-i18n-attr="aria-label:menu.account;title:menu.account">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.2 0-8 2.2-8 5.2V21h16v-1.8c0-3-3.8-5.2-8-5.2Z"/></svg>
          </button>
          <div class="menu" id="user-menu-panel">
            <div class="menu-panel" role="menu">
              <div class="menu-user"><small data-i18n="menu.signedInAs"></small><strong id="user-name"></strong></div>
              <a class="menu-item" role="menuitem" href="/" id="menu-home">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3L12 3Z"/></svg>
                <span data-i18n="menu.home"></span>
              </a>
              <a class="menu-item" role="menuitem" href="#records" id="menu-records">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 5h2v2H4V5Zm4 0h12v2H8V5Zm-4 6h2v2H4v-2Zm4 0h12v2H8v-2Zm-4 6h2v2H4v-2Zm4 0h12v2H8v-2Z"/></svg>
                <span data-i18n="menu.records"></span>
              </a>
              <a class="menu-item needs-admin" role="menuitem" href="#users" id="menu-users">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-3.3 0-7 1.7-7 4.5V20h14v-2.5C16 14.7 12.3 13 9 13Zm7.5-2a3.5 3.5 0 1 0-1-6.9 5.9 5.9 0 0 1 0 6.8c.3.1.6.1 1 .1Zm1.4 2.2A5.6 5.6 0 0 1 20 17.5V20h2v-2.5c0-2-1.8-3.5-4.1-4.3Z"/></svg>
                <span data-i18n="menu.users"></span>
              </a>
              <a class="menu-item needs-admin" role="menuitem" href="#audit" id="menu-audit">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2.1 5l-1.4 1.4A9 9 0 1 0 13 3Zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8H12Z"/></svg>
                <span data-i18n="menu.audit"></span>
              </a>
              <button type="button" class="menu-item" role="menuitem" id="menu-options">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
                <span data-i18n="menu.options"></span>
              </button>
              <button type="button" class="menu-item logout" role="menuitem" id="menu-logout">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 3H4v18h6v-2H6V5h4V3Zm5.6 4.6L14.2 9l2 2H9v2h7.2l-2 2 1.4 1.4L20 12l-4.4-4.4Z"/></svg>
                <span data-i18n="menu.logout"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1 id="hero-title" data-i18n="intro.title"></h1>
      <p id="hero-lede" data-i18n="intro.lede"></p>
      <p class="hero-nav"><a id="hero-link" href="#records" data-i18n="records.link"></a></p>
    </div>
  </section>

  <main class="layout" id="editor-view">
    <form id="form" class="sheet" novalidate>
      <!-- Step 1 -->
      <section class="step" aria-labelledby="step1">
        <span class="step-n" aria-hidden="true">1</span>
        <h2 id="step1" data-i18n="step1.title"></h2>

        <label for="key-type" data-i18n="key.typeLabel"></label>
        <select id="key-type" class="key-type"><option value="01">GTIN (01)</option></select>

        <label for="key-value" id="key-label" data-i18n="gtin.label"></label>
        <input id="key-value" name="key-value" class="code" inputmode="numeric" autocomplete="off"
               maxlength="18" data-i18n-attr="placeholder:gtin.placeholder" aria-describedby="key-msg">
        <p class="field-msg" id="key-msg" aria-live="polite" data-i18n="gtin.hint"></p>

        <!-- Key qualifiers (URI Syntax 1.7, sections 4.4, 4.6, 4.9): one field per qualifier the chosen key
             accepts, in path order; built by app.js from the configuration. -->
        <fieldset class="qualifiers" id="qualifiers-fieldset" hidden>
          <legend data-i18n="qual.legend"></legend>
          <p class="hint" data-i18n="qual.hint"></p>
          <div id="qualifiers"></div>
          <p class="field-msg" id="qual-msg" aria-live="polite"></p>
        </fieldset>

        <button type="button" id="open" class="btn btn-secondary" disabled data-i18n="open.button"></button>
        <p class="field-msg" id="open-msg" aria-live="polite"></p>
        <!-- Other records of the same key (batches, serials, variants…): search, filter, open -->
        <div class="others" id="others" role="region" data-i18n-attr="aria-label:others.aria" hidden>
          <div class="others-head"><strong id="others-title"></strong><span data-i18n="others.help"></span></div>
          <div class="others-tools">
            <input type="search" id="others-search" autocomplete="off" data-i18n-attr="placeholder:others.search;aria-label:others.search">
            <select id="others-filter" data-i18n-attr="aria-label:others.filter"></select>
          </div>
          <div class="others-scroll" id="others-scroll" tabindex="0" data-i18n-attr="aria-label:others.aria">
            <table class="others-table">
              <thead><tr>
                <th data-i18n="others.col.applies"></th>
                <th class="col-desc" data-i18n="others.col.description"></th>
                <th class="col-links" data-i18n="others.col.links"></th>
                <th class="col-when" data-i18n="others.col.changed"></th>
                <th><span class="visually-hidden" data-i18n="others.col.action"></span></th>
              </tr></thead>
              <tbody id="others-body"></tbody>
            </table>
          </div>
          <p class="others-foot" id="others-foot" aria-live="polite"></p>
        </div>
      </section>

      <fieldset id="editor" class="edit" disabled>
        <!-- Step 2 -->
        <section class="step" aria-labelledby="step2">
          <span class="step-n" aria-hidden="true">2</span>
          <h2 id="step2" data-i18n="step2.title"></h2>
          <label for="description" data-i18n="description.label"></label>
          <input id="description" name="description" maxlength="200" data-i18n-attr="placeholder:description.placeholder">
        </section>

        <!-- Step 3 -->
        <section class="step" aria-labelledby="step3">
          <span class="step-n" aria-hidden="true">3</span>
          <h2 id="step3" data-i18n="step3.title"></h2>
          <p class="hint" data-i18n="links.hint"></p>

          <ol id="links" class="links"></ol>
          <div class="links-actions">
            <button type="button" id="add" class="btn btn-ghost needs-editor" data-i18n="links.add"></button>
            <button type="button" id="check-links" class="btn btn-ghost needs-editor" data-i18n="links.check"></button>
          </div>
          <p class="field-msg" id="default-msg" aria-live="polite"></p>
          <p class="field-msg" id="links-check-msg" aria-live="polite"></p>
        </section>

        <div class="actions">
          <button type="submit" id="save" class="btn btn-primary needs-editor" data-i18n="save.button"></button>
          <button type="button" id="delete" class="btn btn-danger needs-editor" hidden data-i18n="delete.button"></button>
          <button type="button" id="history-toggle" class="btn btn-ghost" hidden aria-expanded="false"
                  aria-controls="history-panel" data-i18n="history.button"></button>
        </div>
        <p class="field-msg read-only-note" id="read-only-note" hidden data-i18n="access.readOnly"></p>

        <!-- Versions of this record (journal), newest first; an editor can bring one back into the form -->
        <section class="history-panel" id="history-panel" hidden aria-labelledby="history-title">
          <h3 id="history-title" data-i18n="history.title"></h3>
          <p class="field-msg" id="history-msg" aria-live="polite"></p>
          <ol class="history-list" id="history-list"></ol>
        </section>
      </fieldset>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    </form>

    <aside class="label-panel" data-i18n-attr="aria-label:preview.aria">
      <div class="label">
        <!-- Two groups side by side (one column on phones): the code and its buttons, then its options -->
        <div class="label-visual">
          <div class="qr" id="qr"><span data-i18n="preview.qrPlaceholder"></span></div>
          <p class="qr-info" id="qr-info" aria-live="polite"></p>
          <p class="state" id="state" data-i18n="state.draft"></p>
          <div class="label-actions">
            <a id="test" class="btn btn-secondary" target="_blank" rel="noopener" aria-disabled="true" data-i18n="preview.test"></a>
            <button type="button" id="copy" class="btn btn-ghost" disabled data-i18n="preview.copy"></button>
            <div class="dl-pair">
              <a id="download-png" class="btn btn-ghost" aria-disabled="true" data-i18n="preview.png"></a>
              <a id="download-svg" class="btn btn-ghost" aria-disabled="true" data-i18n="preview.svg"></a>
            </div>
          </div>
        </div>
        <div class="label-controls">
          <fieldset class="label-options">
            <legend data-i18n="label.options"></legend>
            <div class="opt-grid">
              <label class="opt-field"><span data-i18n="label.hri"></span>
                <select id="opt-hri">
                  <option value="full" data-i18n="label.hri.full"></option>
                  <option value="key" data-i18n="label.hri.key"></option>
                  <option value="none" data-i18n="label.hri.none"></option>
                </select>
              </label>
              <label class="opt-field"><span data-i18n="label.version"></span>
                <select id="opt-version">
                  <option value="auto" data-i18n="label.version.auto"></option>
              <option value="1">1 (21 × 21)</option>
              <option value="2">2 (25 × 25)</option>
              <option value="3">3 (29 × 29)</option>
              <option value="4">4 (33 × 33)</option>
              <option value="5">5 (37 × 37)</option>
              <option value="6">6 (41 × 41)</option>
              <option value="7">7 (45 × 45)</option>
              <option value="8">8 (49 × 49)</option>
              <option value="9">9 (53 × 53)</option>
              <option value="10">10 (57 × 57)</option>
              <option value="11">11 (61 × 61)</option>
              <option value="12">12 (65 × 65)</option>
              <option value="13">13 (69 × 69)</option>
              <option value="14">14 (73 × 73)</option>
              <option value="15">15 (77 × 77)</option>
              <option value="16">16 (81 × 81)</option>
              <option value="17">17 (85 × 85)</option>
              <option value="18">18 (89 × 89)</option>
              <option value="19">19 (93 × 93)</option>
              <option value="20">20 (97 × 97)</option>
              <option value="21">21 (101 × 101)</option>
              <option value="22">22 (105 × 105)</option>
              <option value="23">23 (109 × 109)</option>
              <option value="24">24 (113 × 113)</option>
              <option value="25">25 (117 × 117)</option>
              <option value="26">26 (121 × 121)</option>
              <option value="27">27 (125 × 125)</option>
              <option value="28">28 (129 × 129)</option>
              <option value="29">29 (133 × 133)</option>
              <option value="30">30 (137 × 137)</option>
              <option value="31">31 (141 × 141)</option>
              <option value="32">32 (145 × 145)</option>
              <option value="33">33 (149 × 149)</option>
              <option value="34">34 (153 × 153)</option>
              <option value="35">35 (157 × 157)</option>
              <option value="36">36 (161 × 161)</option>
              <option value="37">37 (165 × 165)</option>
              <option value="38">38 (169 × 169)</option>
              <option value="39">39 (173 × 173)</option>
              <option value="40">40 (177 × 177)</option>
                </select>
              </label>
              <label class="opt-field"><span data-i18n="label.ecl"></span>
                <select id="opt-ecl">
                  <option value="l" data-i18n="label.ecl.l"></option>
                  <option value="m" data-i18n="label.ecl.m"></option>
                  <option value="q" data-i18n="label.ecl.q"></option>
                  <option value="h" data-i18n="label.ecl.h"></option>
                </select>
              </label>
            </div>
            <label class="choice" id="opt-attrs-choice" hidden><input type="checkbox" id="opt-attrs" aria-controls="attrs"> <span data-i18n="label.attrs"></span></label>
          </fieldset>
          <!-- GS1 Digital Link data attributes: only in the QR code drawn now, never stored -->
          <div class="attrs" id="attrs" hidden>
            <p class="attrs-note" data-i18n="attrs.note"></p>
            <div id="attr-rows"></div>
            <button type="button" class="btn btn-ghost" id="attr-add" data-i18n="attrs.add"></button>
            <p class="field-msg" id="attr-msg" role="status" aria-live="polite"></p>
          </div>
          <a class="dl code" id="dl" target="_blank" rel="noopener" data-i18n-attr="aria-label:preview.dlAria"></a>
          <dl class="legend">
            <div><dt><span class="sw sw-host"></span><span data-i18n="legend.host"></span></dt><dd data-i18n="legend.hostHelp"></dd></div>
            <div><dt><span class="sw sw-key"></span><span id="legend-key" data-i18n="legend.key" data-i18n-params='{"ai":"01","name":"GTIN"}'></span></dt><dd data-i18n="legend.keyHelp"></dd></div>
            <div id="legend-lot" hidden><dt><span class="sw sw-qual"></span><span data-i18n="legend.qual"></span></dt><dd data-i18n="legend.qualHelp"></dd></div>
            <div id="legend-attr" hidden><dt><span class="sw sw-attr"></span><span data-i18n="legend.attr"></span></dt><dd data-i18n="legend.attrHelp"></dd></div>
          </dl>
        </div>
      </div>
    </aside>
  </main>

  <!-- Record list: every product and batch on the resolver, searchable; opens a record in the editor -->
  <main class="records-main" id="records-view" hidden>
    <section class="sheet">
      <div class="records-toolbar">
        <div class="records-search">
          <label for="records-search" class="visually-hidden" data-i18n="records.search"></label>
          <input id="records-search" type="search" autocomplete="off" data-i18n-attr="placeholder:records.searchPlaceholder">
        </div>
        <a href="#" class="btn btn-primary" id="records-new" data-i18n="records.new"></a>
      </div>
      <!-- Filters: primary key type, key qualifier and author of the last change -->
      <div class="records-filters" role="group" data-i18n-attr="aria-label:records.filters">
        <div class="records-filter">
          <label for="records-key" data-i18n="records.keyType"></label>
          <select id="records-key"></select>
        </div>
        <div class="records-filter">
          <label for="records-qualifier" data-i18n="records.qualifier"></label>
          <select id="records-qualifier"></select>
        </div>
        <div class="records-filter">
          <label for="records-user" data-i18n="records.changedBy"></label>
          <select id="records-user"></select>
        </div>
        <button type="button" class="btn btn-ghost" id="records-clear" data-i18n="records.clearFilters" hidden></button>
      </div>
      <p class="records-code" id="records-code" aria-live="polite" hidden></p>
      <div class="records-sheet">
        <button type="button" class="btn btn-ghost" id="records-export-xlsx" data-i18n="records.exportXlsx"></button>
        <button type="button" class="btn btn-ghost" id="records-export-csv" data-i18n="records.exportCsv"></button>
        <button type="button" class="btn btn-secondary needs-editor" id="records-import" data-i18n="records.import"></button>
        <button type="button" class="btn btn-ghost needs-editor" id="records-check" data-i18n="records.check"></button>
      </div>
      <p class="field-msg" id="records-count" aria-live="polite"></p>
      <div class="records-check">
        <p class="field-msg" id="records-check-msg" aria-live="polite"></p>
        <label class="choice" id="records-problems-wrap" hidden>
          <input type="checkbox" id="records-problems"> <span data-i18n="records.problemsOnly"></span>
        </label>
      </div>
      <div class="table-wrap">
        <table class="records-table">
          <thead>
            <tr>
              <th scope="col" data-i18n="records.col.product"></th>
              <th scope="col" data-i18n="records.col.key"></th>
              <th scope="col" data-i18n="records.col.scope"></th>
              <th scope="col" class="num" data-i18n="records.col.links"></th>
              <th scope="col" data-i18n="records.col.changed"></th>
            </tr>
          </thead>
          <tbody id="records-body"></tbody>
        </table>
      </div>
      <p class="records-empty" id="records-empty" hidden></p>
    </section>
  </main>


  <dialog id="options-dialog" aria-labelledby="options-title">
    <div class="dialog-head">
      <h2 id="options-title" data-i18n="options.title"></h2>
      <button type="button" class="dialog-close" id="options-close" data-i18n-attr="aria-label:options.close">×</button>
    </div>
    <form class="dialog-body" id="password-form" novalidate>
      <div class="status is-error" id="must-change-note" hidden data-i18n="password.mustChangeNote"></div>
      <h3 data-i18n="password.title"></h3>
      <input type="text" name="username" id="password-username" autocomplete="username" hidden>
      <label for="current-password" data-i18n="password.current"></label>
      <input id="current-password" type="password" autocomplete="current-password" required>
      <label for="new-password" data-i18n="password.new"></label>
      <input id="new-password" type="password" autocomplete="new-password" required aria-describedby="new-password-hint">
      <p class="field-msg" id="new-password-hint" data-i18n="password.hint" data-i18n-params='{"min":12}'></p>
      <label for="confirm-password" data-i18n="password.confirm"></label>
      <input id="confirm-password" type="password" autocomplete="new-password" required>
      <div id="password-status" class="status" role="status" aria-live="polite" hidden></div>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="password-cancel" data-i18n="options.cancel"></button>
        <button type="submit" class="btn btn-primary" id="password-save" data-i18n="password.save"></button>
      </div>
    </form>
  </dialog>

  <!-- User administration (administrators) -->
  <main class="records-main" id="users-view" hidden>
    <section class="sheet">
      <h2 data-i18n="users.createTitle"></h2>
      <form class="users-create" id="users-create" novalidate>
        <div>
          <label for="new-user-name" data-i18n="users.name"></label>
          <input id="new-user-name" autocomplete="off" maxlength="64">
        </div>
        <div>
          <label for="new-user-role" data-i18n="users.role"></label>
          <select id="new-user-role"></select>
        </div>
        <div class="users-prefixes">
          <label for="new-user-prefixes" data-i18n="users.prefixes"></label>
          <input id="new-user-prefixes" autocomplete="off" data-i18n-attr="placeholder:users.prefixesPlaceholder">
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="users.create"></button>
      </form>
      <p class="field-msg" data-i18n="users.prefixesHint"></p>
      <div class="status" id="users-status" role="status" aria-live="polite" hidden></div>
      <div class="temp-password" id="temp-password" hidden>
        <p id="temp-password-text"></p>
        <code class="code" id="temp-password-value"></code>
        <button type="button" class="btn btn-ghost" id="temp-password-copy" data-i18n="users.copy"></button>
      </div>

      <h2 data-i18n="users.listTitle"></h2>
      <div class="table-wrap">
        <table class="records-table users-table">
          <thead>
            <tr>
              <th scope="col" data-i18n="users.name"></th>
              <th scope="col" data-i18n="users.role"></th>
              <th scope="col" data-i18n="users.prefixes"></th>
              <th scope="col" data-i18n="users.state"></th>
              <th scope="col" data-i18n="users.lastLogin"></th>
              <th scope="col" data-i18n="users.actions"></th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Audit trail (administrators) -->
  <main class="records-main" id="audit-view" hidden>
    <section class="sheet">
      <form class="audit-filters" id="audit-filters" novalidate>
        <div>
          <label for="audit-user" data-i18n="audit.user"></label>
          <select id="audit-user"></select>
        </div>
        <div>
          <label for="audit-from" data-i18n="audit.from"></label>
          <input type="date" id="audit-from">
        </div>
        <div>
          <label for="audit-to" data-i18n="audit.to"></label>
          <input type="date" id="audit-to">
        </div>
        <div class="audit-text">
          <label for="audit-q" data-i18n="audit.text"></label>
          <input id="audit-q" autocomplete="off" data-i18n-attr="placeholder:audit.textPlaceholder">
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="audit.filter"></button>
        <button type="button" class="btn btn-ghost" id="audit-csv" data-i18n="audit.csv"></button>
      </form>
      <p class="field-msg" id="audit-count" aria-live="polite"></p>
      <div class="table-wrap">
        <table class="records-table audit-table">
          <thead>
            <tr>
              <th scope="col" data-i18n="audit.when"></th>
              <th scope="col" data-i18n="audit.user"></th>
              <th scope="col" data-i18n="audit.action"></th>
              <th scope="col" data-i18n="audit.record"></th>
              <th scope="col" data-i18n="audit.detail"></th>
            </tr>
          </thead>
          <tbody id="audit-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-title">
    <div class="dialog-head">
      <h2 id="import-title" data-i18n="import.title"></h2>
      <button type="button" class="dialog-close" id="import-close" data-i18n-attr="aria-label:options.close">×</button>
    </div>
    <div class="dialog-body">
      <p class="hint" data-i18n="import.intro"></p>
      <label for="import-file" data-i18n="import.file"></label>
      <input type="file" id="import-file" accept=".xlsx,.csv,.txt,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-describedby="import-limits-title">
      <p class="import-limits-title" id="import-limits-title" data-i18n="import.limits"></p>
      <ul class="import-limits" id="import-limits"></ul>
      <label class="choice import-check"><input type="checkbox" id="import-checklinks"> <span data-i18n="import.checkLinks"></span></label>
      <div id="import-status" class="status" role="status" aria-live="polite" hidden></div>
      <div id="import-report" hidden>
        <p class="import-summary" id="import-summary"></p>
        <ul class="import-errors" id="import-errors"></ul>
        <p class="field-msg" id="import-links-msg" aria-live="polite"></p>
        <ul class="import-warnings" id="import-warnings"></ul>
        <div class="table-wrap import-table-wrap">
          <table class="records-table import-table">
            <thead>
              <tr>
                <th scope="col" data-i18n="import.col.rows"></th>
                <th scope="col" data-i18n="records.col.key"></th>
                <th scope="col" data-i18n="records.col.scope"></th>
                <th scope="col" data-i18n="records.col.product"></th>
                <th scope="col" data-i18n="import.col.result"></th>
              </tr>
            </thead>
            <tbody id="import-body"></tbody>
          </table>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="import-cancel" data-i18n="options.cancel"></button>
        <button type="button" class="btn btn-primary" id="import-apply" disabled data-i18n="import.apply" data-i18n-params='{"count":0}'></button>
      </div>
    </div>
  </dialog>

  <template id="link-row">
    <li class="link-row">
      <p class="row-badge"><span data-i18n="link.defaultBadge"></span> <span class="code">gs1:defaultLink</span></p>
      <div class="row-grid">
        <div class="f-type">
          <label data-i18n="link.type"></label>
          <select class="link-type"></select>
        </div>
        <div class="f-language">
          <label data-i18n="link.language"></label>
          <select class="language"></select>
        </div>
        <div class="f-url">
          <label data-i18n="link.url"></label>
          <input class="url" type="url" inputmode="url" data-i18n-attr="placeholder:link.urlPlaceholder">
        </div>
        <div class="f-title">
          <label><span data-i18n="link.title"></span> <span class="opt" data-i18n="link.optional"></span></label>
          <input class="title" maxlength="120">
        </div>
      </div>
      <p class="row-help"></p>
      <p class="row-check" hidden></p>
      <label class="choice fwqs"><input type="checkbox" class="forward" checked>
        <span><span data-i18n="link.forward"></span>
          <span class="opt" data-i18n="link.forwardHint"></span></span></label>
      <div class="row-actions">
        <button type="button" class="make-default" data-i18n="link.makeDefault"></button>
        <button type="button" class="remove" data-i18n="link.remove" data-i18n-attr="aria-label:link.removeAria"></button>
      </div>
    </li>
  </template>

  <script src="i18n.js"></script>
  <script src="password.js"></script>
  <script src="app.js"></script>
</body>
</html>
