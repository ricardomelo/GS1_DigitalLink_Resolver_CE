<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GS1 Resolver Community Edition</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="appearance.css">
  <meta name="robots" content="noindex">
</head>
<body data-title-key="login.pageTitle">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" data-i18n-attr="title:header.home">
        <img src="logo.svg" alt="" width="44" height="44">
        <span class="product">GS1 Resolver Community Edition</span>
      </a>
      <div class="header-tools">
        <label class="locale-picker">
          <span class="visually-hidden" data-i18n="header.language"></span>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8ZM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4ZM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3Zm.8 2h3c.3 1.3.8 2.5 1.4 3.6A8 8 0 0 1 5.1 16ZM8.1 8h-3a8 8 0 0 1 4.4-3.6C8.9 5.5 8.4 6.7 8.1 8ZM12 20c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h3a8 8 0 0 1-4.4 3.6Zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4Z"/></svg>
          <select id="locale"></select>
        </label>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1 data-i18n="login.heroTitle"></h1>
      <p data-i18n="login.heroLede"></p>
    </div>
  </section>

  <main class="auth-layout">
    <form class="auth-card" id="login-form" novalidate>
      <h2 data-i18n="login.title"></h2>
      <div id="login-status" class="status" role="status" aria-live="polite" hidden></div>
      <label for="username" data-i18n="login.username"></label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password" data-i18n="login.password"></label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary" id="login-submit" data-i18n="login.submit"></button>
      <p class="auth-forgot"><button type="button" class="link-button" id="forgot-open" hidden data-i18n="login.forgot"></button></p>
      <!-- Single sign-on (Documentation/adr/0012-single-sign-on.md): shown when an organisation has it on -->
      <button type="button" class="btn btn-ghost auth-sso" id="sso-open" hidden data-i18n="login.ssoOpen"></button>
      <p class="auth-note" id="login-help" data-i18n="login.help"></p>
    </form>

    <form class="auth-card" id="sso-form" novalidate hidden>
      <h2 data-i18n="login.ssoTitle"></h2>
      <p class="auth-lede" data-i18n="login.ssoLede"></p>
      <div id="sso-status" class="status" role="status" aria-live="polite" hidden></div>
      <label for="sso-email" data-i18n="login.ssoEmail"></label>
      <input id="sso-email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
      <button type="submit" class="btn btn-primary" id="sso-submit" data-i18n="login.ssoSubmit"></button>
      <p class="auth-forgot"><button type="button" class="link-button" id="sso-back" data-i18n="login.back"></button></p>
    </form>

    <!-- Password recovery by e-mail (shown when the installation has e-mail; Documentation/adr/0004-e-mail.md) -->
    <form class="auth-card" id="forgot-form" novalidate hidden>
      <h2 data-i18n="login.forgotTitle"></h2>
      <p class="auth-lede" data-i18n="login.forgotLede"></p>
      <div id="forgot-status" class="status" role="status" aria-live="polite" hidden></div>
      <label for="forgot-login" data-i18n="login.forgotLogin"></label>
      <input id="forgot-login" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required>
      <button type="submit" class="btn btn-primary" id="forgot-submit" data-i18n="login.forgotSubmit"></button>
      <p class="auth-forgot"><button type="button" class="link-button" id="forgot-back" data-i18n="login.back"></button></p>
    </form>

    <!-- Choosing a password through an invitation or recovery link (#invite=… or #reset=… in the address) -->
    <form class="auth-card" id="link-form" novalidate hidden>
      <h2 id="link-title" data-i18n="login.linkTitleReset"></h2>
      <div id="link-status" class="status" role="status" aria-live="polite" hidden></div>
      <div id="link-fields" hidden>
        <p class="auth-lede" id="link-lede" data-i18n="login.linkLedeReset"></p>
        <p class="link-user"><span data-i18n="login.username"></span> <strong id="link-user"></strong></p>
        <input type="text" name="username" id="link-username" autocomplete="username" hidden>
        <label for="link-password" data-i18n="password.new"></label>
        <input id="link-password" type="password" autocomplete="new-password" required aria-describedby="link-hint">
        <p class="field-msg" id="link-hint" data-i18n="login.linkHint" data-i18n-params='{"min":12}'></p>
        <label for="link-confirm" data-i18n="password.confirm"></label>
        <input id="link-confirm" type="password" autocomplete="new-password" required>
        <button type="submit" class="btn btn-primary" id="link-submit" data-i18n="login.linkSubmit"></button>
      </div>
      <p class="auth-forgot"><button type="button" class="link-button" id="link-back" data-i18n="login.back"></button></p>
    </form>
  </main>

  <footer class="site-footer">
    <p class="footer-links"><a href="privacy" data-i18n="footer.privacy"></a></p>
    <p class="notice" id="notice" data-i18n="footer.notice"></p>
  </footer>

  <script src="i18n.js"></script>
  <script src="appearance.js"></script>
  <script src="password.js"></script>
  <script src="login.js"></script>
</body>
</html>
