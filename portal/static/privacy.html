<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GS1 Resolver Community Edition</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="appearance.css">
</head>
<!-- The installation's privacy notice, open to anyone (Documentation/adr/0017-privacy-notice.md) -->
<body data-page="privacy" data-title-key="privacy.title">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" data-i18n-attr="title:header.home">
        <img src="logo.svg" alt="" width="44" height="44">
        <span class="product">GS1 Resolver Community Edition</span>
      </a>
      <div class="header-tools">
        <label class="locale-picker">
          <span class="visually-hidden" data-i18n="header.language"></span>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8ZM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4ZM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3Zm.8 2h3c.3 1.3.8 2.5 1.4 3.6A8 8 0 0 1 5.1 16ZM8.1 8h-3a8 8 0 0 1 4.4-3.6C8.9 5.5 8.4 6.7 8.1 8ZM12 20c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h3a8 8 0 0 1-4.4 3.6Zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4Z"/></svg>
          <select id="locale"></select>
        </label>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1 data-i18n="privacy.title"></h1>
      <p id="privacy-version"></p>
    </div>
  </section>

  <main class="records-main privacy-main">
    <section class="sheet">
      <p class="status is-error" id="privacy-status" role="status" hidden></p>
      <p class="status is-warn" id="privacy-older" hidden><span data-i18n="privacy.older"></span>
        <a href="privacy" data-i18n="privacy.inForce"></a></p>
      <article class="privacy-text" id="privacy-body"></article>
      <div id="privacy-history-box" hidden>
        <h2 data-i18n="privacy.history"></h2>
        <ul class="privacy-history" id="privacy-history"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="notice" data-i18n="footer.notice"></p>
  </footer>

  <script src="i18n.js"></script>
  <script src="appearance.js"></script>
  <script src="privacy.js"></script>
</body>
</html>
