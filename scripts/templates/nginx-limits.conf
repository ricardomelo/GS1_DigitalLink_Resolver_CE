# GS1 Resolver CE — limits of the host's nginx for every site it serves (Documentation/adr/0063-host-nginx-limits.md)
# Written by scripts/install.sh on @DATE@ from HOST_NGINX_LIMIT_CONNECTIONS and HOST_NGINX_LIMIT_RATE (.env).
# The installation's proxy limits each address again, more finely, behind this (ADR 0031); this file bounds what one
# address can hold on the host itself: connections, requests, and the time a slow client may take.
limit_conn_zone $binary_remote_addr zone=gs1resolver_conn:10m;
limit_req_zone $binary_remote_addr zone=gs1resolver_req:10m rate=@RATE@r/s;
limit_conn gs1resolver_conn @CONNECTIONS@;
limit_req zone=gs1resolver_req burst=@BURST@ nodelay;
limit_conn_status 429;
limit_req_status 429;
client_header_timeout 10s;
client_body_timeout 15s;
send_timeout 30s;
