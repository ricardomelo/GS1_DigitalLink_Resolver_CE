# GS1 Resolver CE — host reverse proxy for @FQDN@ with an existing certificate
# Generated by scripts/install.sh on @DATE@.
server {
    listen 80;
    listen [::]:80;
    server_name @FQDN@;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" rather than "http2 on": Ubuntu 22.04 and 24.04 ship nginx 1.18 / 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @FQDN@;

    ssl_certificate     @CERT_FILE@;
    ssl_certificate_key @KEY_FILE@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gs1resolver:10m;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:@PROXY_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
