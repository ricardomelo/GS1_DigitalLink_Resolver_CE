# GS1 Resolver CE — host reverse proxy for @FQDN@ with an existing certificate
# Generated by scripts/install.sh on @DATE@.
server {
    listen 80;
    listen [::]:80;
    server_name @FQDN@;
    # to the installation's name, never to the Host the client sent: this site is the host's default for any name
    # (Documentation/adr/0039-known-public-names.md)
    return 301 https://$server_name$request_uri;
}

server {
    # HTTP/1.1 only: HTTP/2 brings little to the resolver's single redirects and holds nginx's most serious flaws, those
    # of November 2026 among them (CVE-2026-123007, CVE-2026-123633; Documentation/adr/0042-host-nginx.md)
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @FQDN@;

    ssl_certificate     @CERT_FILE@;
    ssl_certificate_key @KEY_FILE@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gs1resolver:10m;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:@PROXY_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
